# Production compose file for the Hetzner VPS. See DEPLOYMENT.md and
# ENV_VARS.md (not committed -- copy .env.production alongside this file;
# both files are gitignored) for what every variable means and how to get it.
#
#   docker compose --env-file .env.production up -d --build
#
# Omit the `db` service entirely if using managed Postgres (Neon) instead of
# self-hosting -- point DB_HOST/DB_PORT/DB_PASSWORD at Neon and drop `depends_on`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: SpeechDatabaseInfo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_NAME: SpeechDatabaseInfo
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD}
      MAIN_MEDIA_PATH: ${MAIN_MEDIA_PATH}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      Qwen_API_KEY: ${Qwen_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata: {}
